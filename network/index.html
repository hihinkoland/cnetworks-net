<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <title>Network View</title> <script src="https://unpkg.com"></script> <style>body{margin:0;background:#1e1e1e;color:#dcddde;font-family:sans-serif;overflow:hidden}#graph{width:100vw;height:100vh}#controls{position:fixed;top:16px;left:16px;z-index:10;background:#262626;padding:14px;border-radius:8px;border:1px solid #363636;width:220px;font-size:13px}#controls label{display:block;margin-top:10px}#controls input[type=range]{width:100%}a.back{color:#8b5cf6;text-decoration:none;font-weight:700}</style> </head> <body> <div id="controls"> <a class="back" href="/cnetworks-net/">← Back to Notes</a> <h3 style="margin:8px 0 4px">Physics Controls</h3> <label>Repel Force: <span id="repelVal">-120</span> <input type="range" id="repel" min="-500" max="-10" value="-120"> </label> <label>Link Distance: <span id="distVal">60</span> <input type="range" id="dist" min="10" max="250" value="60"> </label> <label>Center Gravity: <span id="centerVal">0.05</span> <input type="range" id="center" min="0" max="0.5" step="0.01" value="0.05"> </label> </div> <div id="graph"></div> <script>const BASE="/cnetworks-net";fetch(`${BASE}/graph.json`).then((e=>e.json())).then((e=>{const t=Array.isArray(e.nodes)?e.nodes:Object.values(e.nodes),n=e.links||[],o=ForceGraph()(document.getElementById("graph")).graphData({nodes:t,links:n}).backgroundColor("#1e1e1e").nodeId("id").nodeLabel((e=>e.title||e.id)).nodeAutoColorBy((e=>e.tags&&e.tags[0]||"default")).linkColor((()=>"rgba(255,255,255,0.2)")).linkDirectionalParticles(1).linkDirectionalParticleSpeed(.004).nodeCanvasObject(((e,t,n)=>{const o=e.title||e.id,r=12/n;t.beginPath(),t.arc(e.x,e.y,5,0,2*Math.PI,!1),t.fillStyle=e.color||"#8b5cf6",t.fill(),n>.8&&(t.font=`${r}px Sans-Serif`,t.textAlign="center",t.textBaseline="top",t.fillStyle="#dcddde",t.fillText(o,e.x,e.y+7))})).onNodeClick((e=>{if(!e.url)return;const t=e.url.startsWith(BASE)?e.url:`${BASE}${e.url}`;window.location.href=t}));o.d3Force("c
